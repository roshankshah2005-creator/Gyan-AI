name: Wake Gyan App

on:
  schedule:
    - cron: "0 */6 * * *"  # Runs automatically every 6 hours
  workflow_dispatch:        # Allows you to trigger it manually anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App URL
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://your-gyan-app-url.streamlit.app' # Replace with your actual Streamlit link
          method: 'GET'
