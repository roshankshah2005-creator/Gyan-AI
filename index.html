<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYAN AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <style>
        .brand-font { font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-white h-screen flex overflow-hidden">

    <!-- Auth Modal (Login / Signup) -->
    <div id="auth-modal" class="fixed inset-0 bg-gray-950 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-900 border border-gray-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <h1 class="brand-font text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-indigo-400 text-center mb-1">gyan</h1>
            <p class="text-gray-400 text-xs text-center mb-6">Your Intelligent Multi-Persona AI Companion</p>
            
            <div class="flex border-b border-gray-800 mb-6">
                <button onclick="switchTab('login')" id="tab-login-btn" class="flex-1 pb-2 font-bold text-teal-400 border-b-2 border-teal-400 text-sm">Login</button>
                <button onclick="switchTab('signup')" id="tab-signup-btn" class="flex-1 pb-2 font-bold text-gray-500 text-sm">Create Account</button>
            </div>

            <!-- Login Form -->
            <div id="login-form">
                <input type="email" id="login-email" placeholder="Email" class="w-full p-3 bg-gray-950 border border-gray-700 rounded-xl mb-3 text-white focus:outline-none focus:border-teal-400">
                <input type="password" id="login-password" placeholder="Password" class="w-full p-3 bg-gray-950 border border-gray-700 rounded-xl mb-4 text-white focus:outline-none focus:border-teal-400">
                <button onclick="handleLogin()" class="w-full py-3 bg-teal-500 hover:bg-teal-400 text-gray-950 font-bold rounded-xl transition">Login to Gyan</button>
            </div>

            <!-- Signup Form -->
            <div id="signup-form" style="display: none;">
                <input type="text" id="signup-username" placeholder="Username" class="w-full p-3 bg-gray-950 border border-gray-700 rounded-xl mb-3 text-white focus:outline-none focus:border-teal-400">
                <input type="email" id="signup-email" placeholder="Email" class="w-full p-3 bg-gray-950 border border-gray-700 rounded-xl mb-3 text-white focus:outline-none focus:border-teal-400">
                <input type="password" id="signup-password" placeholder="Password (min 6 chars)" class="w-full p-3 bg-gray-950 border border-gray-700 rounded-xl mb-4 text-white focus:outline-none focus:border-teal-400">
                <button onclick="handleSignup()" class="w-full py-3 bg-teal-500 hover:bg-teal-400 text-gray-950 font-bold rounded-xl transition">Create Account</button>
            </div>
            <p id="auth-error" class="text-red-400 text-xs text-center mt-3"></p>
        </div>
    </div>

    <!-- Sidebar -->
    <aside class="w-72 bg-gray-900 border-r border-gray-800 flex flex-col p-4">
        <h1 class="brand-font text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-indigo-400 text-center mb-1">gyan</h1>
        <p id="user-badge" class="text-center text-xs text-teal-400 font-semibold mb-4 uppercase">CHATTING AS: USER</p>
        
        <button onclick="handleLogout()" class="w-full py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold rounded-lg mb-4 transition">🚪 Logout</button>
        <button onclick="createNewChat()" class="w-full py-3 bg-teal-500 hover:bg-teal-400 text-gray-950 font-bold rounded-xl mb-4 transition">➕ New Chat</button>

        <div class="flex-1 overflow-y-auto space-y-2 mb-4" id="chat-history-list">
            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Chat History</h3>
        </div>

        <div class="pt-4 border-t border-gray-800">
            <label class="text-xs text-gray-400 font-semibold mb-1 block">AI PERSONA</label>
            <select id="persona-select" class="w-full p-2.5 bg-gray-950 border border-gray-700 rounded-xl text-sm text-teal-400 focus:outline-none">
                <option>Exam Prep Coach</option>
                <option>Strict Professor</option>
                <option>Senior Tech Lead</option>
                <option>Data Science Mentor</option>
                <option>Creative Director</option>
                <option>Research (Quick Mode)</option>
                <option>Research (Deep Mode)</option>
            </select>
        </div>
    </aside>

    <!-- Main Chat Window -->
    <main class="flex-1 flex flex-col bg-gray-950">
        <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-6">
            <div class="h-full flex flex-col items-center justify-center text-center">
                <h2 id="greeting-title" class="text-4xl font-extrabold text-teal-400 mb-2">Hello!</h2>
                <p class="text-gray-400 text-sm">Ask an exam derivation, technical problem, or chat with your coach...</p>
            </div>
        </div>

        <div class="p-4 bg-gray-900 border-t border-gray-800 flex gap-3">
            <input type="text" id="chat-input" placeholder="Ask an exam derivation, technical problem, or chat with your coach..." class="flex-1 p-3.5 bg-gray-950 border border-gray-700 rounded-xl text-white focus:outline-none focus:border-teal-400" onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="px-6 py-3.5 bg-teal-500 hover:bg-teal-400 text-gray-950 font-bold rounded-xl transition">Send</button>
        </div>
    </main>

    <script>
        // Replace with your Supabase credentials
        const SUPABASE_URL = "YOUR_SUPABASE_URL";
        const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUserId = null;
        let currentUsername = null;
        let chats = [];
        let activeChatId = null;

        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                currentUserId = session.user.id;
                currentUsername = session.user.user_metadata.username || session.user.email.split('@')[0];
                document.getElementById('auth-modal').style.display = 'none';
                initApp();
            }
        }
        checkSession();

        function switchTab(tab) {
            if (tab === 'login') {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('signup-form').style.display = 'none';
                document.getElementById('tab-login-btn').className = "flex-1 pb-2 font-bold text-teal-400 border-b-2 border-teal-400 text-sm";
                document.getElementById('tab-signup-btn').className = "flex-1 pb-2 font-bold text-gray-500 text-sm";
            } else {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('signup-form').style.display = 'block';
                document.getElementById('tab-signup-btn').className = "flex-1 pb-2 font-bold text-teal-400 border-b-2 border-teal-400 text-sm";
                document.getElementById('tab-login-btn').className = "flex-1 pb-2 font-bold text-gray-500 text-sm";
            }
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('auth-error').innerText = error.message;
            } else {
                location.reload();
            }
        }

        async function handleSignup() {
            const username = document.getElementById('signup-username').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const { data, error } = await supabase.auth.signUp({
                email,
                password,
                options: { data: { username } }
            });
            if (error) {
                document.getElementById('auth-error').innerText = error.message;
            } else {
                alert('Account created! You can now log in.');
                switchTab('login');
            }
        }

        async function handleLogout() {
            await supabase.auth.signOut();
            location.reload();
        }

        async function initApp() {
            document.getElementById('user-badge').innerText = `CHATTING AS: ${currentUsername.toUpperCase()}`;
            document.getElementById('greeting-title').innerText = `Hello, ${currentUsername}!`;
            await loadChats();
        }

        async function loadChats() {
            const { data } = await supabase.from('chats').select('*').eq('user_id', currentUserId).order('updated_at', { ascending: false });
            if (data && data.length > 0) {
                chats = data;
                activeChatId = chats[0].id;
            } else {
                const initialId = 'chat_' + Math.random().toString(36).substring(2, 8);
                chats = [{ id: initialId, title: 'New Chat', messages: [] }];
                activeChatId = initialId;
                await saveChatsToDb();
            }
            renderSidebar();
            renderChat();
        }

        async function saveChatsToDb() {
            for (const chat of chats) {
                await supabase.from('chats').upsert({
                    id: chat.id,
                    user_id: currentUserId,
                    title: chat.title,
                    messages: chat.messages
                });
            }
        }

        function createNewChat() {
            const newId = 'chat_' + Math.random().toString(36).substring(2, 8);
            chats.unshift({ id: newId, title: 'New Chat', messages: [] });
            activeChatId = newId;
            saveChatsToDb();
            renderSidebar();
            renderChat();
        }

        function renderSidebar() {
            const list = document.getElementById('chat-history-list');
            list.innerHTML = '<h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Chat History</h3>';
            chats.forEach(chat => {
                const isActive = chat.id === activeChatId;
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3 rounded-xl text-sm truncate transition ${isActive ? 'bg-gray-800 text-teal-400 font-semibold border border-gray-700' : 'text-gray-400 hover:bg-gray-850'}`;
                btn.innerText = `📌 ${chat.title}`;
                btn.onclick = () => { activeChatId = chat.id; renderSidebar(); renderChat(); };
                list.appendChild(btn);
            });
        }

        function renderChat() {
            const container = document.getElementById('chat-messages');
            const activeChat = chats.find(c => c.id === activeChatId);
            if (!activeChat || activeChat.messages.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-center">
                        <h2 class="text-4xl font-extrabold text-teal-400 mb-2">Hello, ${currentUsername}!</h2>
                        <p class="text-gray-400 text-sm">Ask an exam derivation, technical problem, or chat with your coach...</p>
                    </div>`;
                return;
            }

            container.innerHTML = '';
            activeChat.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`;
                div.innerHTML = `<div class="max-w-2xl p-4 rounded-2xl text-sm leading-relaxed ${msg.role === 'user' ? 'bg-teal-600 text-white rounded-br-none' : 'bg-gray-900 border border-gray-800 text-gray-200 rounded-bl-none'}">${msg.content}</div>`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const inputEl = document.getElementById('chat-input');
            const text = inputEl.value.trim();
            if (!text) return;

            const activeChat = chats.find(c => c.id === activeChatId);
            activeChat.messages.push({ role: 'user', content: text });
            if (activeChat.title === 'New Chat') {
                activeChat.title = text.substring(0, 25) + (text.length > 25 ? '...' : '');
            }

            inputEl.value = '';
            renderSidebar();
            renderChat();

            const persona = document.getElementById('persona-select').value;

            try {
                const res = await fetch('/.netlify/functions/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: activeChat.messages, persona })
                });
                const data = await res.json();
                activeChat.messages.push({ role: 'assistant', content: data.reply });
                await saveChatsToDb();
                renderChat();
            } catch (err) {
                activeChat.messages.push({ role: 'assistant', content: 'Error communicating with Groq API.' });
                renderChat();
            }
        }
    </script>
</body>
</html>
